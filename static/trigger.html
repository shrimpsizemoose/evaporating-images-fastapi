<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Science Art</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon {
      font-size: 120px;
      margin-bottom: 40px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    h1 {
      font-size: 36px;
      font-weight: 600;
      margin-bottom: 24px;
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 20px;
      color: #999;
      margin-bottom: 56px;
      line-height: 1.4;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      color: #0a0a0a;
      text-decoration: none;
      padding: 20px 32px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 17px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
    }

    .cta:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(255, 255, 255, 0.1);
    }

    .footer {
      margin-top: 24px;
      font-size: 15px;
      color: #666;
    }

    @media (max-width: 480px) {
      body {
        padding: 32px 20px;
      }

      .icon {
        font-size: 100px;
        margin-bottom: 32px;
      }

      h1 {
        font-size: 32px;
        margin-bottom: 20px;
      }

      .subtitle {
        font-size: 18px;
        margin-bottom: 48px;
      }

      .cta {
        width: 100%;
        justify-content: center;
        padding: 22px 32px;
        font-size: 16px;
      }

      .footer {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="icon">✨</div>
    <h1>Внимание на экран ноутбука!</h1>
    <p class="subtitle">Обновите страницу чтобы снова добавить пикселей</p>
    <a href="https://t.me/this_is_science_art" class="cta" target="_blank">

      <svg width="20px" height="20px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

        <g id="SVGRepo_bgCarrier" stroke-width="0" />

        <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round" />


        <g id="SVGRepo_iconCarrier">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M23.1117 4.49449C23.4296 2.94472 21.9074 1.65683 20.4317 2.227L2.3425 9.21601C0.694517 9.85273 0.621087 12.1572 2.22518 12.8975L6.1645 14.7157L8.03849 21.2746C8.13583 21.6153 8.40618 21.8791 8.74917 21.968C9.09216 22.0568 9.45658 21.9576 9.70712 21.707L12.5938 18.8203L16.6375 21.8531C17.8113 22.7334 19.5019 22.0922 19.7967 20.6549L23.1117 4.49449ZM3.0633 11.0816L21.1525 4.0926L17.8375 20.2531L13.1 16.6999C12.7019 16.4013 12.1448 16.4409 11.7929 16.7928L10.5565 18.0292L10.928 15.9861L18.2071 8.70703C18.5614 8.35278 18.5988 7.79106 18.2947 7.39293C17.9906 6.99479 17.4389 6.88312 17.0039 7.13168L6.95124 12.876L3.0633 11.0816ZM8.17695 14.4791L8.78333 16.6015L9.01614 15.321C9.05253 15.1209 9.14908 14.9366 9.29291 14.7928L11.5128 12.573L8.17695 14.4791Z"
            fill="#0F0F0F" />
        </g>

      </svg>
      телеграм канал мастерской Science Art
    </a>
    <div class="footer">спасибо, что пришли!</div>
  </div>
  <script>
    fetch('/api/trigger', {method: 'POST'});
  </script>
</body>

</html>
