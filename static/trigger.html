<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Science Art</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        .container {
            max-width: 420px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            font-size: 80px;
            margin-bottom: 32px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.3;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 16px;
            color: #999;
            margin-bottom: 48px;
            line-height: 1.5;
        }

        .cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #ffffff;
            color: #0a0a0a;
            text-decoration: none;
            padding: 16px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
        }

        .cta:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(255, 255, 255, 0.1);
        }

        .footer {
            margin-top: 64px;
            font-size: 13px;
            color: #666;
        }

        @media (max-width: 480px) {
            .icon {
                font-size: 64px;
                margin-bottom: 24px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 12px;
            }

            .subtitle {
                font-size: 15px;
                margin-bottom: 40px;
            }

            .cta {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✨</div>
        <h1>Внимание на экран!</h1>
        <p class="subtitle">Обнови страницу чтобы снова добавить пикселей</p>
        <a href="https://t.me/this_is_science_art" class="cta" target="_blank">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            Science Art
        </a>
        <div class="footer">мастерская Science Art</div>
    </div>
    <script>
        fetch('/api/trigger', {method: 'POST'});
    </script>
</body>
</html>
